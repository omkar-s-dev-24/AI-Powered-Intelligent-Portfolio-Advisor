{% extends 'base.html' %}
{% block content %}
<div class="row mb-5">
    <div class="col-md-12 text-center">
        <h2 class="fw-bold display-5"><i class="fas fa-globe me-3 text-primary"></i>Global Financial News</h2>
        <p class="text-secondary lead">Real-time market intelligence and economic updates.</p>
    </div>
</div>

<div id="news-container" class="row g-4">
    <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
        <p class="mt-3 text-secondary">Fetching latest headlines from Google News...</p>
    </div>
</div>
<br>
<hr>
<div class="footer-text"><p class="mb-0">AI-Powered Portfolio Advisory System • Third Year Engineering Project</p></div>

<script>
    fetch('/api/news/')
    .then(res => res.json())
    .then(data => {
        const container = document.getElementById('news-container');
        container.innerHTML = ''; // Clear loader
        
        data.news.forEach(item => {
            const col = document.createElement('div');
            col.className = 'col-md-4';
            col.innerHTML = `
                <div class="glass-card h-100 d-flex flex-column border-top border-4 border-primary">
                    <div class="d-flex justify-content-between mb-3">
                        <span class="badge bg-dark border border-secondary"><i class="fas fa-rss me-1"></i>Market News</span>
                        <small class="text-white-50">${item.time}</small>
                    </div>
                    
                    <h5 class="mb-3 fw-bold text-white">${item.title}</h5>
                    
                    <div class="mt-auto pt-3 border-top border-secondary d-flex justify-content-between align-items-center">
                        <small class="text-info"><i class="far fa-newspaper me-1"></i>${item.source}</small>
                        <a href="${item.link}" target="_blank" class="btn btn-sm btn-outline-primary rounded-pill px-3">
                            Read Full Story <i class="fas fa-external-link-alt ms-1"></i>
                        </a>
                    </div>
                </div>
            `;
            container.appendChild(col);
        });
    });
</script>
{% endblock %}
