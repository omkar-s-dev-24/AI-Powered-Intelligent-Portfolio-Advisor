<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Advisor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        /* Navbar */
        .navbar { background-color: #000000; border-bottom: 1px solid #333; padding: 15px 0; }
        .navbar-brand { font-weight: bold; font-size: 1.5rem; color: #4285F4 !important; }
        .nav-link { color: #aaa !important; margin-right: 15px; }
        .nav-link:hover, .nav-link.active { color: #fff !important; }

        /* Glass Cards */
        .glass-card {
            background: #111;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        /* Buttons & Inputs */
        .btn-primary { background-color: #4285F4; border: none; }
        .btn-outline-primary { border-color: #4285F4; color: #4285F4; }
        .btn-outline-primary:hover { background-color: #4285F4; color: #fff; }
        .form-control { background: #222; border: 1px solid #444; color: #fff; }
        .form-control:focus { background: #222; color: #fff; border-color: #4285F4; box-shadow: none; }

        /* Helpers */
        .text-success { color: #00C853 !important; }
        .text-danger { color: #FF3D00 !important; }
        .text-warning { color: #FFD600 !important; }
        .fw-bold { font-weight: 700 !important; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="fas fa-brain me-2"></i>AI Advisor</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/analyzer/">Stock Analyzer</a></li>
                    <li class="nav-item"><a class="nav-link" href="/news/">News & Sentiment</a></li>
                    <li class="nav-item"><a class="nav-link" href="/risk/">Risk Analysis</a></li>
                    <li class="nav-item"><a class="nav-link" href="/wealth/">Wealth Tools</a></li>
                    <li class="nav-item"><a class="nav-link" href="/compare/">Compare Stocks</a></li>
                    <li class="nav-item"><a class="nav-link" href="/about/">About</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
